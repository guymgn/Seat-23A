<style>
:root{
  --purple:#7C5CFF;
  --bg:#f2f1ee; --text:#1c1c1e; --muted:#6e6e73; --card:#ffffff; --line:rgba(0,0,0,.08); --ctl:#f2f2f4;
  --wall-a:#efeeea; --wall-b:#d8d6d0;
  --bezel-a:#fbfaf8; --bezel-b:#d3d0c9;
  --blind-a:#f1efea; --blind-b:#dcd9d2;
}
html[data-theme=dark]{
  --bg:#0e0f11; --text:#f2f2f4; --muted:#8e8e93; --card:#1c1c1e; --line:rgba(255,255,255,.08); --ctl:#2c2c2e;
  --wall-a:#2b2c31; --wall-b:#18191c;
  --bezel-a:#3a3b41; --bezel-b:#1d1e22;
  --blind-a:#cfccc5; --blind-b:#a8a59e;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;align-items:center;gap:20px;padding:28px 16px 48px}
h1{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--muted);margin:0;text-transform:uppercase}

.stage{width:360px;height:470px;border-radius:36px;position:relative;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 38%,var(--wall-a),var(--wall-b));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 24px 60px rgba(0,0,0,.18)}
.wallspill{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(60% 55% at 50% 50%,var(--spill,transparent),transparent 100%);opacity:.35}

/* Window: outer radius 120, inset 20, inner radius 100 (concentric) */
.bezel{width:268px;height:372px;border-radius:120px;padding:20px;position:relative;overflow:hidden;
  background:linear-gradient(160deg,var(--bezel-a),var(--bezel-b));
  box-shadow:inset 0 4px 10px rgba(0,0,0,.22),inset 0 -2px 4px rgba(255,255,255,.3),0 1px 0 rgba(255,255,255,.45)}
/* outside light spilling onto the window reveal */
.reveal{position:absolute;inset:20px;border-radius:100px;pointer-events:none;
  box-shadow:0 0 16px 5px var(--spill,transparent),0 0 3px 1px var(--spill,transparent)}
.pane{position:relative;width:228px;height:332px;border-radius:100px;overflow:hidden;background:#05070f;
  touch-action:none;cursor:grab;isolation:isolate;-webkit-mask-image:-webkit-radial-gradient(white,black);outline:none}
.pane:active{cursor:grabbing}
.pane:focus-visible{box-shadow:0 0 0 3px var(--purple)}
.pane>*{position:absolute;inset:0;pointer-events:none}
canvas{width:228px;height:332px}
#fade{opacity:0}

.glass{background:
  linear-gradient(118deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,0) 26%,rgba(255,255,255,0) 74%,rgba(255,255,255,.04) 100%)}
.breather{inset:auto;left:112px;bottom:20px;width:4px;height:4px;border-radius:50%;
  background:rgba(0,0,0,.4);box-shadow:0 0 0 1px rgba(255,255,255,.2)}
.blind{height:calc(100% - 3px);bottom:auto;will-change:transform;
  background:
    repeating-linear-gradient(180deg,rgba(0,0,0,.028) 0 1px,transparent 1px 7px),
    linear-gradient(180deg,var(--blind-a),var(--blind-b));
  box-shadow:0 2px 6px rgba(0,0,0,.25)}
.blind .glow{position:absolute;inset:0;opacity:0;background:linear-gradient(180deg,transparent 40%,var(--leak,#fff) 100%);mix-blend-mode:soft-light}
.blind .lip{position:absolute;left:0;right:0;bottom:0;height:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.08));border-bottom:1px solid rgba(0,0,0,.18)}
.blind .grip{position:absolute;left:50%;bottom:5px;width:46px;height:6px;margin-left:-23px;border-radius:3px;
  background:rgba(0,0,0,.14);box-shadow:inset 0 1px 1px rgba(0,0,0,.2),0 1px 0 rgba(255,255,255,.5)}
.rim{border-radius:100px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.4),inset 0 0 14px rgba(0,0,0,.5),inset 0 6px 14px rgba(0,0,0,.25)}

.hint{font-size:13px;color:var(--muted);margin-top:-6px}
.panel{width:360px;background:var(--card);border-radius:20px;padding:6px 16px;box-shadow:0 0 0 1px var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row label,.row .k{font-size:14px}
.v{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--purple)}
.seg{display:inline-flex;background:var(--ctl);border-radius:9px;padding:2px}
.seg button{border:0;background:transparent;color:var(--text);font:inherit;font-size:13px;padding:5px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.btn{border:0;background:var(--ctl);color:var(--text);font:inherit;font-size:13px;padding:6px 11px;border-radius:9px;cursor:pointer}
input[type=color]{width:34px;height:26px;border:0;padding:0;background:none;cursor:pointer}
input[type=checkbox]{accent-color:var(--purple);width:18px;height:18px}
.col{flex-direction:column;align-items:stretch;gap:6px}
.col .top{display:flex;justify-content:space-between;align-items:center}
a.btn{text-decoration:none;display:inline-block}
.combo{position:relative}
.combo::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);pointer-events:none}
.combo input{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--ctl);border:0;border-radius:9px;padding:8px 32px 8px 11px;outline:none}
.combo input::placeholder{color:var(--muted)}
.combo input:focus-visible{box-shadow:0 0 0 2px var(--purple)}
#locList{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:6;margin:0;padding:4px;list-style:none;background:var(--card);border-radius:12px;box-shadow:0 0 0 1px var(--line),0 12px 30px rgba(0,0,0,.2);max-height:236px;overflow:auto;-webkit-overflow-scrolling:touch}
#locList li{padding:8px 9px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#locList li span{color:var(--muted);font-size:13px;white-space:nowrap}
#locList li[aria-selected=true]{background:var(--ctl)}
#locList li.head,#locList li.none{font-size:12px;color:var(--muted);cursor:default;padding:6px 9px 3px}
#locList li.none{font-size:14px;padding:8px 9px}
.credit{font-size:13px;color:var(--muted);margin:0}
.lede{font-size:15px;color:var(--muted);margin:-12px 0 0}
.credit a{color:var(--text);text-decoration:underline;text-underline-offset:3px}
.credit a:focus-visible,a.btn:focus-visible,.btn:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.themeToggle{position:fixed;top:14px;right:14px;z-index:5;width:34px;height:34px;padding:0;border:0;border-radius:9px;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;transition:background-color .2s ease}
.themeToggle:hover,.themeToggle:focus-visible{background:color-mix(in srgb,var(--purple) 12%,transparent);color:var(--purple);outline:none}
.themeToggle:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.themeToggle i{width:17px;height:17px;border:1.5px solid currentColor;border-radius:50%;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}

<script>(function(){try{var t=localStorage.getItem("theme");if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t}catch(e){}})();</script>

<body>
<button class="themeToggle" id="themeToggle" type="button" aria-label="Switch theme"><i aria-hidden="true"></i></button>
<h1>Seat 23A</h1>
<p class="lede">The view from the window seat, live.</p>

<div class="stage" id="stage">
  <div class="wallspill"></div>
  <div class="bezel">
    <div class="reveal"></div>
    <div class="pane" id="pane" tabindex="0" role="button" aria-label="Window blind, open. Swipe down or press space to close.">
      <canvas id="sky"></canvas>
      <canvas id="fade"></canvas>
      <div class="glass"></div>
      <div class="breather"></div>
      <div class="blind" id="blind"><div class="glow" id="blindGlow"></div><div class="lip"><div class="grip"></div></div></div>
      <div class="rim"></div>
    </div>
  </div>
</div>
<div class="hint" id="hint" aria-live="polite">Swipe down on the window to close the blind. Tap to toggle.</div>

<div class="panel">
  <div class="row col">
    <div class="top"><span class="k">Time</span><span class="v" id="readout">--</span></div>
    <input type="range" id="time" min="0" max="1439" step="1" aria-label="Time of day">
    <div class="top">
      <div class="seg" id="modeSeg">
        <button data-mode="live" aria-pressed="true">Live</button>
        <button data-mode="scrub" aria-pressed="false">Scrub</button>
        <button data-mode="cycle" aria-pressed="false">Play 24h</button>
      </div>
    </div>
  </div>
  <div class="row col">
    <div class="top"><label for="cover">Cloud cover</label><button class="btn" id="gustBtn">Fly through cloud</button></div>
    <input type="range" id="cover" min="0" max="100" value="46">
  </div>
  <div class="row">
    <label for="sound">Cabin sound</label>
    <input type="checkbox" id="sound">
  </div>
  <div class="row col">
    <div class="top"><label for="locInput">Location</label><button class="btn" id="locBtn" type="button">Use my location</button></div>
    <div class="combo">
      <input id="locInput" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="locList" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search a city">
      <ul id="locList" role="listbox" aria-label="Cities" hidden></ul>
    </div>
    <div class="v" id="locNote" style="text-align:left" aria-live="polite"></div>
  </div>
  <div class="row">
    <label for="purple">Wing strobe</label>
    <input type="color" id="purple" value="#7c5cff">
  </div>
  <div class="row">
    <label for="livery">Winglet livery</label>
    <input type="checkbox" id="livery" checked>
  </div>
  <div class="row">
    <div><div class="k">Wing 3D model</div><div class="v" style="text-align:left">The same wing, as a mesh</div></div>
    <div style="display:flex;gap:6px">
      <a class="btn" href="wing.blend" download="seat-23a-wing.blend">Blender</a>
      <a class="btn" href="wing.glb" download="seat-23a-wing.glb">glTF</a>
    </div>
  </div>
</div>
<p class="credit">Created by <a href="https://www.guymagen.com">Guy Magen</a> · <a href="https://github.com/guymgn/Seat-23A">Source on GitHub</a></p>

(() => {
const $ = id => document.getElementById(id);
const clamp = (x,a,b) => Math.min(b,Math.max(a,x));
const sstep = (a,b,x) => { const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
const hex = h => { h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)/255); };
const toHex = c => '#'+c.map(v=>Math.round(clamp(v,0,1)*255).toString(16).padStart(2,'0')).join('');
const mixC = (a,b,t) => a.map((v,i)=>v+(b[i]-v)*t);
const rad = Math.PI/180;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- sun position (simplified NOAA) ----------
function sunPos(date, lat, lon){
  const d = (date.getTime() - 946728000000) / 86400000;
  const g = (357.529 + 0.98560028*d)*rad;
  const q = 280.459 + 0.98564736*d;
  const L = (q + 1.915*Math.sin(g) + 0.020*Math.sin(2*g))*rad;
  const e = (23.439 - 0.00000036*d)*rad;
  const ra = Math.atan2(Math.cos(e)*Math.sin(L), Math.cos(L));
  const dec = Math.asin(Math.sin(e)*Math.sin(L));
  const gmst = (18.697374558 + 24.06570982441908*d) % 24;
  const ha = ((gmst*15 + lon)*rad) - ra;
  const la = lat*rad;
  const elev = Math.asin(Math.sin(la)*Math.sin(dec) + Math.cos(la)*Math.cos(dec)*Math.cos(ha));
  const az = Math.atan2(-Math.sin(ha), Math.tan(dec)*Math.cos(la) - Math.sin(la)*Math.cos(ha));
  return { elev: elev/rad, az: ((az/rad)+360)%360 };
}
// moon phase 0 new, .5 full
const moonPhase = date => { const p=((date.getTime()-947182440000)/(29.530588853*86400000))%1; return p<0?p+1:p; };

 {e:90, zen:'#1f5cc0',hor:'#a8cdee',haze:'#c8dbec',amb:'#93a6c2',sun:'#ffffff'},
].map(k=>{const o={e:k.e};for(const n in k) if(n!=='e') o[n]=hex(k[n]); return o;});
function palette(e){
  let i=0; while(i<KEYS.length-2 && e>KEYS[i+1].e) i++;
  const a=KEYS[i], b=KEYS[i+1], t=clamp((e-a.e)/(b.e-a.e),0,1), o={};
  for(const n in a) if(n!=='e') o[n]=mixC(a[n],b[n],t);
  return o;
}
function phaseName(e, az){
  if(e < -12) return 'Night';
  if(e < -4)  return 'Blue hour';
  if(e < 1)   return az < 180 ? 'Sunrise' : 'Sunset';
  if(e < 10)  return 'Golden hour';
  return 'Day';
}

// Minutes between a city's wall clock and the viewer's, so the timeline reads in the city's local time.
function shiftFor(zone, lon){
  const d=new Date(), here=d.getHours()*60+d.getMinutes();
  let there;
  try {
    const p=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);
    there=(+p.find(x=>x.type==='hour').value%24)*60+(+p.find(x=>x.type==='minute').value);
  } catch(e) { there=here+d.getTimezoneOffset()+Math.round(lon/15)*60; }
  let sft=there-here; while(sft>720) sft-=1440; while(sft<-720) sft+=1440;
  return sft;
}
// Northern lights: always in Finland, Iceland and Norway, and anywhere else far enough north.

// city search: popular places when empty, type to filter
let opts=[], active=-1;
function matches(q){
  q=q.toLowerCase().trim();
  if(!q) return POPULAR;
  const a=CITIES.filter(c=>c.n.startsWith(q));
  const b=CITIES.filter(c=>!c.n.startsWith(q)&&(c.n.includes(' '+q)||c.c.startsWith(q)||c.c.includes(' '+q)));
  return a.concat(b).slice(0,8);
}
function setActive(i){
  active=i;
  [...locList.querySelectorAll('[role=option]')].forEach((el,k)=>{ el.setAttribute('aria-selected',k===i); if(k===i) el.scrollIntoView({block:'nearest'}); });
  if(i>=0) locInput.setAttribute('aria-activedescendant','loc-opt-'+i); else locInput.removeAttribute('aria-activedescendant');
}
function openList(q){
  opts=matches(q); locList.textContent='';
  const add=(cls,text)=>{ const li=document.createElement('li'); li.className=cls; li.textContent=text; li.setAttribute('role','presentation'); locList.appendChild(li); };
  if(!q.trim()) add('head','Popular');
  if(!opts.length) add('none','No city by that name');
  opts.forEach((c,i)=>{
    const li=document.createElement('li'); li.id='loc-opt-'+i; li.setAttribute('role','option'); li.setAttribute('aria-selected','false');
    li.append(c.name); const sp=document.createElement('span'); sp.textContent=c.country; li.appendChild(sp);
    li.addEventListener('pointerdown',e=>e.preventDefault());   // keep focus in the field
    li.addEventListener('click',()=>choose(i));
    locList.appendChild(li);
  });
  locList.hidden=false; locInput.setAttribute('aria-expanded','true');
  setActive(q.trim()&&opts.length?0:-1);
}
function closeList(){ locList.hidden=true; locInput.setAttribute('aria-expanded','false'); setActive(-1); locInput.value=loc.label; }
function choose(i){
  const c=opts[i]; if(!c) return;
  setLocation(c, auroraFor(c.lat,c.country)>.3 ? AURORA_HINT : 'The sky there, right now');
  closeList(); locInput.blur();
}
locInput.addEventListener('focus',()=>{ locInput.select(); openList(''); });
locInput.addEventListener('input',()=>openList(locInput.value));
locInput.addEventListener('blur',closeList);
locInput.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); if(locList.hidden) openList(''); else if(opts.length) setActive((active+1)%opts.length); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(opts.length) setActive((active-1+opts.length)%opts.length); }
  else if(e.key==='Enter'){ e.preventDefault(); if(!locList.hidden) choose(active>=0?active:0); }
  else if(e.key==='Escape'){ if(!locList.hidden){ e.preventDefault(); closeList(); locInput.blur(); } }
});

// ---------- wing texture: R albedo, G up-facing, B livery mask, A coverage (premultiplied) ----------
// The wing is real geometry: a 737-style planform projected through the scene camera,
// viewed from a left-side window seat a little behind the trailing edge.
const CAM={F:.75,HOR:.53};
function buildWing(){
  const S=2, W=228*S, Hh=332*S, F=CAM.F, PI=Math.PI;
  const C=[-7.35,1.28,1.8], yaw=6*rad, d=[Math.sin(yaw),Math.cos(yaw)], rt=[Math.cos(yaw),-Math.sin(yaw)];
  const proj=P=>{const vx=P[0]-C[0],vy=P[1]-C[1],vz=P[2]-C[2];const dep=Math.max(vx*d[0]+vz*d[1],.08);
    return [114+(vx*rt[0]+vz*rt[1])/dep*F*332, 332*(1-CAM.HOR)-vy/dep*F*332, dep, Math.hypot(vx,vy,vz)];};
  // planform (metres): x forward, y up, z out along the span
  const zr=1.88, zk=5.9, zt=17;
  const xle=z=>-(z-zr)*.52, xte=z=>z<zk?-6.19:-6.19-(z-zk)*.2675;
  const ydi=z=>(z-zr)*.105+.55*((z-zr)/(zt-zr))**2;              // dihedral plus in-flight flex
  const yt=(xc,tk)=>5*tk*(.2969*Math.sqrt(xc)-.126*xc-.3516*xc*xc+.2843*xc**3-.1036*xc**4);
  const WP=(z,xc)=>{const c=xle(z)-xte(z),sp=(z-zr)/(zt-zr);return [xle(z)-xc*c,ydi(z)+yt(xc,.13-.035*sp)*c,z];};
  // blended winglet: sweeps from flat to near vertical
  const NS=26, WS=[]; {let dy=0,dz=0;const L=2.9;
    for(let k=0;k<=NS;k++){const t=k/NS,th=80*rad*sstep(0,.34,t);
      WS.push({dy,dz,ch:1.3-.8*t**.9,xo:-2.05*t**1.3,t,ny:Math.cos(th)});
      dy+=Math.sin(th)*L/NS;dz+=Math.cos(th)*L/NS;}}
  const xt=xle(zt), ytip=ydi(zt);
  const GP=(k,xc)=>{const w=WS[k];return [xt+w.xo-xc*w.ch,ytip+w.dy+yt(xc,.09)*w.ch*w.ny,zt+w.dz];};

  const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
  const ny=(p0,p1,p3)=>{const a=sub(p1,p0),b=sub(p3,p0);const n=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
    return Math.abs(n[1])/(Math.hypot(...n)||1);};
  const inr=(v,a,b)=>v>=a&&v<=b;
  const albedo=(z,xc)=>{
    if(xc<.09) return .78;
    if(xc>.73&&(inr(z,2.1,5.75)||inr(z,6.05,11.55))) return .845;
    if(xc>.77&&inr(z,11.85,15.7)) return .855;
    if(inr(xc,.58,.72)&&inr(z,6.3,11.3)) return .815;
    return .885;};
  const quads=[];
  const NZ=46, NC=18, z0=2.1, cs=j=>(1-Math.cos(PI*j/NC))/2;
  for(let i=0;i<NZ;i++){const za=z0+(zt-z0)*i/NZ,zb=z0+(zt-z0)*(i+1)/NZ;
    for(let j=0;j<NC;j++){const xa=cs(j),xb=cs(j+1);
      const P=[WP(za,xa),WP(zb,xa),WP(zb,xb),WP(za,xb)],q=P.map(proj);
      quads.push({q,ny:ny(P[0],P[1],P[3]),alb:albedo((za+zb)/2,(xa+xb)/2),liv:0,dist:(q[0][3]+q[2][3])/2});}}
  for(let k=0;k<NS;k++)for(let j=0;j<8;j++){const xa=j/8,xb=(j+1)/8;
    const P=[GP(k,xa),GP(k+1,xa),GP(k+1,xb),GP(k,xb)],q=P.map(proj);
    quads.push({q,ny:(WS[k].ny+WS[k+1].ny)/2,alb:.89,liv:sstep(.26,.5,WS[k].t),dist:(q[0][3]+q[2][3])/2-.4});}
  quads.sort((a,b)=>b.dist-a.dist);

  const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=Hh;const x=c.getContext('2d');x.scale(S,S);x.lineJoin='round';return x;};
  const r=mk(), u=mk(), b=mk();
  const g=(v,a=1)=>{v=Math.round(clamp(v,0,1)*255);return `rgba(${v},${v},${v},${a})`;};

  // flap track fairings: spindles slung under the wing, tails poking out behind the trailing edge
  [3.7,7.3,10.7].forEach(zf=>{
    const A=[xte(zf)+1.6,ydi(zf)-.06,zf],B=[xte(zf)-.78,ydi(zf)-.27,zf],N=16,top=[],bot=[];
    for(let k=0;k<=N;k++){const t=k/N,P=[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,zf],c=proj(P);
      const rad_=.17*Math.sin(PI*t)**.6*(1-.4*t)/c[2]*F*332;
      top.push([c[0],c[1]-rad_]);bot.push([c[0],c[1]+rad_]);}
    const path=x=>{x.beginPath();top.forEach((q,k)=>k?x.lineTo(q[0],q[1]):x.moveTo(q[0],q[1]));bot.reverse().forEach(q=>x.lineTo(q[0],q[1]));bot.reverse();x.closePath();};
    const mid=top[N>>1],lo=bot[N>>1];
    path(r);const gr=r.createLinearGradient(0,mid[1],0,lo[1]);gr.addColorStop(0,g(.84));gr.addColorStop(.5,g(.72));gr.addColorStop(1,g(.38));r.fillStyle=gr;r.fill();
    path(u);const gu=u.createLinearGradient(0,mid[1],0,lo[1]);gu.addColorStop(0,g(.85));gu.addColorStop(1,g(.05));u.fillStyle=gu;u.fill();
  });

  const fillQ=(x,q,style)=>{x.beginPath();x.moveTo(q[0][0],q[0][1]);for(let k=1;k<4;k++)x.lineTo(q[k][0],q[k][1]);x.closePath();
    x.fillStyle=style;x.strokeStyle=style;x.lineWidth=.6;x.fill();x.stroke();};
  quads.forEach(Q=>{fillQ(r,Q.q,g(Q.alb*(.93+.07*Q.ny)));fillQ(u,Q.q,g(Q.ny));if(Q.liv>0)fillQ(b,Q.q,g(1,Q.liv));});

  // control surface gaps and panel lines, drawn in 3D so they follow the perspective
  const line=(pts,a,wk=1)=>{for(let k=0;k<pts.length-1;k++){const p0=proj(pts[k]),p1=proj(pts[k+1]);
    r.strokeStyle=`rgba(38,42,52,${a})`;r.lineWidth=clamp(2.6/((p0[2]+p1[2])/2),.35,2.2)*wk;r.beginPath();r.moveTo(p0[0],p0[1]);r.lineTo(p1[0],p1[1]);r.stroke();}};
  const span=(xc,za,zb,a,wk)=>{const pts=[];for(let k=0;k<=24;k++)pts.push(WP(za+(zb-za)*k/24,xc));line(pts,a,wk);};
  const chord=(z,xa,xb,a,wk)=>{const pts=[];for(let k=0;k<=10;k++)pts.push(WP(z,xa+(xb-xa)*k/10));line(pts,a,wk);};
  span(.73,2.1,5.75,.6,1.3);chord(5.75,.73,1,.6);
  span(.73,6.05,11.55,.6,1.3);chord(6.05,.73,1,.6);chord(11.55,.73,1,.6);chord(8.8,.73,1,.35);
  span(.77,11.85,15.7,.55,1.2);chord(11.85,.77,1,.55);chord(15.7,.77,1,.55);
  span(.58,6.3,11.3,.4);span(.72,6.3,11.3,.3);[6.3,7.55,8.8,10.05,11.3].forEach(z=>chord(z,.58,.72,.4));
  span(.09,2.1,16.6,.22);[4,9.5,13,15].forEach(z=>chord(z,.1,.56,.12));
  span(1,2.1,zt,.65,1.5);
  // static wicks
  [12.6,13.6,14.6,15.4,16.3].forEach(z=>{const P=WP(z,1);line([P,[P[0]-.32,P[1]-.04,P[2]]],.85,.7);});
  [9,16,22].forEach(k=>{const P=GP(k,1);line([P,[P[0]-.3,P[1],P[2]]],.85,.7);});
  // bright lip along the winglet's leading edge
  r.strokeStyle='rgba(250,250,250,.7)';r.lineWidth=.7;r.beginPath();
  for(let k=0;k<=NS;k++){const q=proj(GP(k,0));k?r.lineTo(q[0],q[1]):r.moveTo(q[0],q[1]);}r.stroke();

  const R=r.getImageData(0,0,W,Hh).data, U=u.getImageData(0,0,W,Hh).data, Bm=b.getImageData(0,0,W,Hh).data;
  const out=new Uint8Array(W*Hh*4);
  for(let i=0;i<W*Hh*4;i+=4){ const a=R[i+3]/255;
    out[i]=R[i]*a; out[i+1]=U[i]*(U[i+3]/255); out[i+2]=Bm[i]*(Bm[i+3]/255); out[i+3]=R[i+3]; }
  const tp=proj([xte(zt)+.15,ytip+.06,zt]);
  return {data:out,w:W,h:Hh,tip:[tp[0],tp[1]]};
}

const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `
precision highp float;
uniform sampler2D uNoise,uWing;
uniform vec2 uRes,uOff,uTip;

float noise(vec3 x){
  vec3 p=floor(x),f=fract(x);f=f*f*(3.-2.*f);

  return mix(rg.r,rg.g,f.z);
}
// cloud deck: slab from y=-1 to y=0, flat bases, billowing tops
float cloud(vec3 p,float lod){
  float h=p.y+1.;
  if(h<0.||h>1.)return 0.;
  vec3 q=p*.75;
  float big=noise(q*.17+vec3(3.,0.,9.));
  float n=noise(q)*.55+noise(q*2.07+11.)*.26;
  if(lod>.5)n+=noise(q*4.3+5.)*.125+noise(q*9.1)*.065; else n+=.095;

}
vec3 horizonCol(vec3 rd){
  float az=max(dot(normalize(rd.xz),normalize(uSunD.xz)),0.);
  vec3 away=mix(uHor,uZen,uAway);
  return mix(away,uHor,pow(az,4.));

float wispF(vec2 p,float s){
  vec3 q=vec3(p.x*1.1+uTime*1.9+s,p.y*2.2+s*.3,uTime*.25+s);

  const boltI=night*(pulse(bt,0,.07)+pulse(bt,.11,.05)*.6+pulse(bt,.2,.3)*.9)*(.7+.3*Math.sin(t*90))*5;

  // flight motion
  const turb=(.35+wisp*1.4)*ms;
  const shake=(Math.sin(t*7.3)*.5+Math.sin(t*12.7+1)*.3+Math.sin(t*19.1)*.2)*turb;
  const horizon=CAM.HOR+.006*Math.sin(t*.23)*ms+shake*.0022;
  const bank=(.02*Math.sin(t*.11)+.007*Math.sin(t*.37))*ms+shake*.0015;
  const flexPx=(Math.sin(t*1.3)*.5+Math.sin(t*3.1)*.2)*ms+shake*.9;
  dist+=dt*.22*ms;

  // strobe: double flash
  const ph=t%1.7;
  const flash=Math.max(pulse(ph,0,.09),pulse(ph,.22,.09));

  const hidden = bl.y===CLOSED && bl.target===CLOSED;
  const idle = now-lastInput>IDLE_MS;
  const glDue = onScreen && now-lastGL >= (!document.hasFocus()?100:(idle?1000/15:1000/30))-4;
  if(hasGL && !hidden && glDue){
    lastGL=now;
    const elF=(s.elev<8?s.elev:8+(s.elev-8)*.2)*rad, az=-.285;
    const dir=(a,e)=>[Math.sin(a)*Math.cos(e),Math.sin(e),Math.cos(a)*Math.cos(e)];
    const sunD=dir(az,elF), moonD=dir(.22,17*rad);
    const useSun=sunAmt>0;
    const lightD=useSun?dir(az,Math.max(elF,11*rad)):dir(.22,24*rad);
    const lightC=useSun?P.sun.map(v=>v*sunAmt):[.34,.4,.6].map(v=>v*moonAmt*.5);
    const moonW=[.05,.06,.1].map(v=>v*moonAmt);
    const ambW=mixC(P.zen,P.hor,.6).map((v,i)=>v*.2+P.amb[i]*.6+moonW[i]);
    const twi=clamp(1-(s.elev+2)/11,0,1);
    gl.uniform2f(U.uRes,canvas.width,canvas.height);
    gl.uniform1f(U.uTime,t%1000);
    gl.uniform2f(U.uOff,dist,dist*.1); gl.uniform1f(U.uF,CAM.F);
    gl.uniform1f(U.uBand,4.5+10*twi); gl.uniform1f(U.uFogMix,.3+.5*twi);
    gl.uniform1f(U.uWingSun,Math.sin(Math.max(s.elev,0)*rad));
    gl.uniform2f(U.uTip,wingInfo.tip[0]/228,1-(wingInfo.tip[1]+flexPx)/332);
    gl.uniform1f(U.uHorizon,horizon); gl.uniform1f(U.uBank,bank); gl.uniform1f(U.uCamH,3.2);
    gl.uniform1f(U.uCov,.54-.26*cover);
    gl.uniform1f(U.uNight,night); gl.uniform1f(U.uSunVis,sstep(-2.5,.5,s.elev));
    gl.uniform1f(U.uAway,clamp(.55-s.elev/16,.1,.55));
    gl.uniform1f(U.uAurora,loc.aurora||0); gl.uniform1f(U.uStrobe,flash); gl.uniform1f(U.uWisp,wisp);
    gl.uniform1f(U.uFlex,flexPx/332); gl.uniform1f(U.uLivery,livery?1:0);
    gl.uniform1f(U.uPhase,phase); gl.uniform1f(U.uDay,daylight);
    gl.uniform3fv(U.uZen,P.zen); gl.uniform3fv(U.uHor,P.hor); gl.uniform3fv(U.uHaze,P.haze);
    gl.uniform3fv(U.uAmb,P.amb); gl.uniform3fv(U.uSunC,P.sun.map(v=>v*sstep(-4,1,s.elev)));
    gl.uniform3fv(U.uLightC,lightC); gl.uniform3fv(U.uSunD,sunD); gl.uniform3fv(U.uLightD,lightD);
    gl.uniform3fv(U.uMoonD,moonD); gl.uniform3fv(U.uPurple,purple); gl.uniform3fv(U.uAmbW,ambW);
    gl.uniform3f(U.uBolt,bolt.x,bolt.z,boltI);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
    // drop resolution if the device cannot hold 60fps
    if(auto && rawDt<.2){ acc+=rawDt; frames++; if(frames===90){ if(acc/frames>.024 && level<LEVELS.length-1){ level++; sizeCanvas(); } acc=0; frames=0; } }
  } else if(!hasGL){
    pane.style.background=`linear-gradient(180deg,${toHex(P.zen)},${toHex(P.hor)} 40%,${toHex(P.amb)} 60%,${toHex(P.amb.map(v=>v*.6))})`;
  }

  // outside light spilling onto the reveal and wall; the strobe reaches it at night
  const open=clamp(-bl.y/(-OPEN),0,1);
  const sp=mixC(P.hor,P.sun,.4);
  const sa=(daylight*.26+flash*night*.2)*open;
  const spc=sp.map((v,i)=>v*daylight+purple[i]*flash*night);
  const cssTo={spill:[...spc.map(v=>clamp(v,0,1)),sa], leak:P.hor.slice(), glow:daylight*.55};
  cssNow=(fadeK<1&&cssFrom)?{spill:mixA(cssFrom.spill,cssTo.spill,fe),leak:mixA(cssFrom.leak,cssTo.leak,fe),glow:cssFrom.glow+(cssTo.glow-cssFrom.glow)*fe}:cssTo;
  stage.style.setProperty('--spill',`rgba(${cssNow.spill.slice(0,3).map(v=>Math.round(v*255)).join(',')},${cssNow.spill[3].toFixed(3)})`);

  stepBlind(dt);
  blind.style.transform=`translate3d(0,${bl.y.toFixed(2)}px,0)`;
  $('blindGlow').style.setProperty('--leak',toHex(cssNow.leak));
  $('blindGlow').style.opacity=(cssNow.glow*clamp(1+bl.y/H,0,1)).toFixed(3);

  if(now-lastRead>250){
    lastRead=now;
    const hh=String(Math.floor(minutes/60)).padStart(2,'0'), mm=String(Math.floor(minutes%60)).padStart(2,'0');
    $('readout').textContent=`${hh}:${mm} · ${phaseName(s.elev,s.az)}${(loc.aurora>.3&&night>.5)?' · Aurora':''} · sun ${s.elev.toFixed(0)}°`;
    if(mode!=='scrub') $('time').value=Math.floor(minutes);
  }
  const now2=performance.now();
  if(!cabinOn && !bl.drag && (now2-lastInput>IDLE_MS || (blurAt!==null && now2-blurAt>BLUR_MS))){
    running=false; $('hint').textContent='Paused to save power. Move or tap to resume.'; return;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
